<script>
    (function () {
        if (window.initSidebarBehavior) window.initSidebarBehavior();
        const toggle = document.getElementById("btnToggleSidebar");
        if (toggle) {
            toggle.onclick = function (event) {
                event.preventDefault();
                if (window.toggleSidebar) window.toggleSidebar();
            };
        }
        $(document).on("click", "#btnHomeIndex", function () {
            window.location.href = "import.html";
        });
    })();
