<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <title>IMCD Operations Tool — Login</title>

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <link rel="stylesheet" href="styles/imcd-style.css">
    <link rel="stylesheet" href="styles/style4.css">

    <style>
        body {
            background: linear-gradient(180deg, #0d1b3d 0%, #162a5c 100%);
            color: #fff;
            font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .login-wrapper {
            background: #ffffff;
            color: #1f2a44;
            border-radius: 10px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, .25);
            width: 100%;
            max-width: 400px;
            padding: 2rem 2.5rem;
            text-align: center;
        }

        .logo {
            width: 80%;
            max-width: 220px;
            margin-bottom: 1.5rem;
        }

        .login-title {
            font-size: 14px;
            font-weight: 600;
            color: #294586;
            margin-bottom: 10px;
        }

        .form-control {
            margin-bottom: 1rem;
        }

        .btn-login {
            width: 100%;
            font-weight: 600;
            padding: .55rem;
            background-color: #294586;
            border: none;
            color: white;
        }

        .btn-login:hover {
            background-color: #18306e;
        }
    </style>

</head>

<body>

    <div class="login-wrapper">

        <img src="imgs/LOGO_OT.png" class="logo" alt="IMCD Operations Tool">

        <h4>IMCD Operations Tool</h4>
        <div class="login-title">Login Access Without Safenet</div>


        <form id="loginForm" onsubmit="event.preventDefault(); login();">

            <label for="user"></label><input id="user" type="text" class="form-control" placeholder="User" required>

            <label for="password"></label><input id="password" type="password" class="form-control"
                placeholder="Password" required>

            <button type="submit" class="btn btn-login">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>

        </form>

        <div id="pageAlert" class="alert mt-3" style="display:none;"></div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

    <script>
        window.DEV_LOGIN = true;
        const APP_URL = "/operationstool";
        const URLBACKEND = APP_URL + "/";
    </script>

    <script>

        function showPageAlert(msg) {

            const $a = $('#pageAlert');

            $a.removeClass('alert-success alert-danger alert-warning alert-info')
                .addClass('alert-danger')
                .text(msg)
                .show();

            setTimeout(() => { $a.fadeOut(300) }, 3000);

        }

        function login() {

            const user = ($("#user").val() || "").trim();
            const password = ($("#password").val() || "").trim();

            if (!user || !password) {
                showPageAlert("User and password required");
                return;
            }

            return $.post({
                url: URLBACKEND + "login_dev",
                data: {
                    user: user,
                    password: password
                }
            })
                .then(function (data) {

                    if (!data || data.length === 0) {
                        showPageAlert("User not found");
                        return;
                    }

                    let commonUser = {};
                    let operationstoolUser = {};

                    commonUser.Profiles = [];
                    operationstoolUser.Profiles = [];

                    /* COMMON APPS USER */

                    commonUser.UCA_IdRegion = data[0].UCA_IdRegion || "";
                    commonUser.UCA_TipoUserId = data[0].UCA_TipoUserId || "";
                    commonUser.UCA_Id = user;
                    commonUser.UCA_IdBuyer = "";
                    commonUser.UCA_Mail = data[0].UCA_Mail || "";
                    commonUser.UCA_LocalADUser = user;
                    commonUser.UCA_UserStatus = "Active";
                    commonUser.UCA_UserName = data[0].UCA_UserName || "";
                    commonUser.UCA_User = data[0].UCA_Mail || "";

                    /* Operations Tool user */

                    operationstoolUser.CFG_SendEmail = false;
                    operationstoolUser.UOT_Id = data[0].UCA_UserName || user;
                    operationstoolUser.UOT_UserName = data[0].UCA_UserName || user;
                    operationstoolUser.UOT_LocalADUser = user;
                    operationstoolUser.UOT_Mail = data[0].UCA_Mail || "";

                    /* PROFILES SIN DUPLICADOS */

                    let profiles = new Set();

                    data.forEach(itm => {
                        if (itm.UCA_TipoUserId) {
                            profiles.add(itm.UCA_TipoUserId);
                        }
                    });

                    profiles.forEach(p => {
                        commonUser.Profiles.push(p);
                        operationstoolUser.Profiles.push(p);
                    });

                    /* GUARDAR SESIONES */

                    localStorage.setItem("commonAppsusuario", JSON.stringify(commonUser));
                    localStorage.setItem("operationstoolusuario", JSON.stringify(operationstoolUser));
                    localStorage.setItem("operationstoolusuarioOriginal", JSON.stringify(operationstoolUser));

                    /* ASEGURAR CONFIGURACIÓN MENÚ */

                    if (!localStorage.getItem("commonAppsmenu_color"))
                        localStorage.setItem("commonAppsmenu_color", "default");

                    if (!localStorage.getItem("operationstoolmenu_color"))
                        localStorage.setItem("operationstoolmenu_color", "default");

                    /* REDIRECCIÓN */

                    window.location.href = APP_URL + "/dashboard.html";

                })
                .catch(function (e) {

                    if (e.status === 401 || e.status === 404) {

                        if (e.responseText) {
                            showPageAlert(e.responseText);
                        } else {
                            showPageAlert("Login rejected");
                        }

                    } else {

                        showPageAlert("Backend error");

                    }

                });

        }

    </script>

</body>

</html>
